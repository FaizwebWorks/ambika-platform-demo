<!doctype html>
<html lang="gu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Ambika Platform — Demo Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --white:#FFFFFF;
        --fog:#F5F5F7;
        --fog2:#ECECF0;
        --ink:#1D1D1F;
        --smoke:#424245;
        --muted:#6E6E73;
        --meta:#86868B;
        --blue:#0071E3;
        --blue-hover:#0077ED;
        --green:#1F9D55;
        --amber:#E8A13A;
        --red:#D64545;
        --teal:#0E7C86;
        --hairline:#D2D2D7;
        --radius:28px;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ margin:0; padding:0; }
      body{
        background:var(--fog);
        color:var(--ink);
        font-family:'Questrial','Noto Sans Gujarati','Noto Sans Devanagari',system-ui,sans-serif;
        font-size:18px;
        line-height:1.45;
      }
      button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
      input{ font-family:inherit; }

      /* Phone column */
      .phone{
        max-width:430px;
        margin:0 auto;
        background:var(--white);
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        position:relative;
      }
      @media (min-width:520px){
        .phone{ border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); }
      }

      /* Header */
      .appbar{
        position:sticky; top:0; z-index:20;
        background:var(--white);
        padding:14px 18px 10px;
      }
      .appbar-row{ display:flex; align-items:center; gap:12px; }
      .icon-btn{
        width:48px; height:48px; flex:0 0 48px;
        border-radius:50%;
        background:var(--fog);
        display:flex; align-items:center; justify-content:center;
        color:var(--ink);
      }
      .icon-btn:active{ background:var(--fog2); }
      .icon-btn svg{ width:26px; height:26px; }
      .appbar-title{
        flex:1; text-align:center;
        font-size:21px; letter-spacing:-0.01em;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .appbar-spacer{ width:48px; flex:0 0 48px; }

      /* Language switcher */
      .langbar{
        display:flex; gap:8px;
        background:var(--fog);
        border-radius:999px;
        padding:5px;
      }
      .langbar button{
        flex:1; min-height:48px;
        border-radius:999px;
        font-size:17px;
        color:var(--smoke);
        padding:6px 4px;
      }
      .langbar button.active{
        background:var(--blue); color:#fff;
      }
      .langbar.big{ margin-top:14px; }
      .langbar.big button{ min-height:56px; font-size:18px; }
      .appbar .langbar{ margin-top:12px; }
      .appbar .langbar button{ min-height:42px; font-size:16px; }

      /* Views */
      .view{ padding:10px 20px 40px; animation:viewIn .28s ease both; flex:1; }
      @keyframes viewIn{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:none; } }
      @media (prefers-reduced-motion: reduce){
        .view{ animation:none; }
      }

      /* Login */
      .login-hero{ text-align:center; padding:18px 6px 4px; }
      .login-hero svg{ width:100%; max-width:340px; height:auto; }
      .trust-name{ font-size:27px; letter-spacing:-0.01em; text-align:center; margin:14px 0 2px; }
      .trust-sub{ text-align:center; color:var(--muted); font-size:17px; margin:0 0 8px; }
      .field{ margin-top:16px; }
      .field label{ display:block; font-size:17px; color:var(--smoke); margin:0 0 8px 6px; }
      .field-wrap{
        display:flex; align-items:center; gap:12px;
        background:var(--fog); border-radius:20px;
        padding:0 18px; min-height:68px;
      }
      .field-wrap svg{ width:26px; height:26px; color:var(--meta); flex:0 0 26px; }
      .field-wrap input{
        flex:1; border:none; outline:none; background:transparent;
        font-size:20px; color:var(--ink); min-width:0;
      }
      .demo-note{ text-align:center; color:var(--meta); font-size:15px; margin:14px 10px 0; }
      .login-footer{ text-align:center; color:var(--meta); font-size:14px; padding:26px 20px 8px; }

      /* Buttons */
      .btn{
        display:flex; align-items:center; justify-content:center; gap:10px;
        width:100%; min-height:64px;
        border-radius:999px;
        font-size:20px;
        padding:12px 22px;
        margin-top:20px;
        text-align:center;
      }
      .btn svg{ width:26px; height:26px; flex:0 0 26px; }
      .btn-blue{ background:var(--blue); color:#fff; }
      .btn-blue:active{ background:var(--blue-hover); }
      .btn-green{ background:var(--green); color:#fff; }
      .btn-outline{ background:var(--white); color:var(--blue); border:2px solid var(--blue); }
      .btn-fog{ background:var(--fog); color:var(--ink); }
      .btn.disabled{ opacity:.38; pointer-events:none; }
      .btn-row{ display:flex; gap:12px; }
      .btn-row .btn{ flex:1; }

      /* Home */
      .greeting{ font-size:28px; letter-spacing:-0.01em; margin:8px 2px 4px; }
      .greeting-sub{ color:var(--muted); font-size:17px; margin:0 2px 20px; }
      .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .tile{
        background:var(--fog); border-radius:var(--radius);
        padding:22px 14px 18px;
        display:flex; flex-direction:column; align-items:center; gap:12px;
        text-align:center; min-height:158px; justify-content:center;
        width:100%;
      }
      .tile:active{ background:var(--fog2); }
      .tile .chip{
        width:68px; height:68px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
      }
      .tile .chip svg{ width:34px; height:34px; }
      .tile .tile-label{ font-size:19px; line-height:1.25; }

      /* Steps */
      .step-dots{ display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0 18px; }
      .step-dot{
        width:40px; height:40px; border-radius:50%;
        background:var(--fog); color:var(--muted);
        display:flex; align-items:center; justify-content:center;
        font-size:18px;
      }
      .step-dot.now{ background:var(--blue); color:#fff; }
      .step-dot.done{ background:var(--green); color:#fff; }
      .step-line{ width:34px; height:4px; border-radius:2px; background:var(--fog2); }
      .step-q{ font-size:26px; letter-spacing:-0.01em; text-align:center; margin:2px 0 20px; }

      .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .cat{
        background:var(--fog); border-radius:var(--radius);
        padding:20px 10px 16px; min-height:132px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
        font-size:18px; text-align:center; width:100%;
        border:3px solid transparent;
      }
      .cat svg{ width:40px; height:40px; }
      .cat.selected{ border-color:var(--blue); background:#E8F2FD; }

      .place-list{ display:flex; flex-direction:column; gap:12px; }
      .place{
        background:var(--fog); border-radius:22px;
        min-height:64px; padding:12px 20px;
        display:flex; align-items:center; gap:14px;
        font-size:19px; text-align:left; width:100%;
        border:3px solid transparent;
      }
      .place svg{ width:28px; height:28px; color:var(--blue); flex:0 0 28px; }
      .place.selected{ border-color:var(--blue); background:#E8F2FD; }

      .photo-tile{
        background:var(--fog); border-radius:var(--radius);
        padding:16px; text-align:center; margin-top:16px;
      }
      .photo-tile svg{ width:100%; max-width:280px; height:auto; }
      .photo-ok{
        display:inline-flex; align-items:center; gap:8px;
        color:var(--green); font-size:18px; margin-top:10px;
      }
      .photo-ok svg{ width:22px; height:22px; }
      .spoken-box{
        background:var(--fog); border-radius:22px;
        padding:18px 20px; font-size:19px; margin-top:16px; text-align:center;
      }
      .or-line{ text-align:center; color:var(--meta); font-size:16px; margin:20px 0 2px; }

      .urgency-list{ display:flex; flex-direction:column; gap:14px; }
      .urgency{
        background:var(--fog); border-radius:24px;
        min-height:78px; padding:14px 22px;
        display:flex; align-items:center; gap:16px;
        font-size:21px; text-align:left; width:100%;
        border:3px solid transparent;
      }
      .urgency .dot{ width:22px; height:22px; border-radius:50%; flex:0 0 22px; }
      .urgency.selected{ border-color:var(--ink); background:var(--white); }

      /* Success */
      .success-wrap{ text-align:center; padding-top:34px; }
      .big-tick{
        width:110px; height:110px; border-radius:50%;
        background:var(--green); color:#fff;
        display:flex; align-items:center; justify-content:center;
        margin:0 auto 22px;
      }
      .big-tick svg{ width:58px; height:58px; }
      .big-tick.blue{ background:var(--blue); }
      .success-title{ font-size:26px; letter-spacing:-0.01em; margin:0 10px 8px; }
      .ticket-no{ font-size:21px; color:var(--smoke); margin:0 0 6px; }
      .ticket-no b{ color:var(--ink); font-weight:600; }

      /* Tracker */
      .tracker{ margin:30px 6px 6px; }
      .tracker-track{ display:flex; align-items:flex-start; }
      .tracker-step{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; width:64px; }
      .tracker-dot{
        width:44px; height:44px; border-radius:50%;
        background:var(--fog2); color:var(--muted);
        display:flex; align-items:center; justify-content:center; font-size:18px;
      }
      .tracker-dot svg{ width:24px; height:24px; }
      .tracker-dot.done{ background:var(--green); color:#fff; }
      .tracker-dot.now{ background:var(--blue); color:#fff; }
      .tracker-bar{ flex:1; height:5px; border-radius:3px; background:var(--fog2); margin-top:20px; }
      .tracker-bar.done{ background:var(--green); }
      .tracker-labels{ display:flex; margin-top:10px; }
      .tracker-labels span{ flex:1; text-align:center; font-size:15.5px; color:var(--smoke); padding:0 2px; }

      /* Lists and cards */
      .card{
        background:var(--fog); border-radius:var(--radius);
        padding:20px; margin-bottom:16px; width:100%; text-align:left; display:block;
      }
      button.card:active{ background:var(--fog2); }
      .card-top{ display:flex; gap:16px; align-items:center; }
      .thumb{
        width:84px; height:84px; flex:0 0 84px;
        border-radius:20px; background:var(--white);
        display:flex; align-items:center; justify-content:center; overflow:hidden;
      }
      .thumb svg{ width:56px; height:56px; }
      .card-title{ font-size:20px; margin:0 0 4px; line-height:1.3; }
      .card-sub{ color:var(--muted); font-size:16.5px; margin:0; display:flex; align-items:center; gap:7px; }
      .card-sub svg{ width:19px; height:19px; flex:0 0 19px; }
      .status-chip{
        display:inline-flex; align-items:center; gap:8px;
        border-radius:999px; color:#fff;
        font-size:16.5px; padding:8px 16px; margin-top:14px;
      }
      .status-chip .cdot{ width:10px; height:10px; border-radius:50%; background:#fff; }
      .chip-amber{ background:var(--amber); }
      .chip-blue{ background:var(--blue); }
      .chip-green{ background:var(--green); }
      .chip-teal{ background:var(--teal); }
      .chip-red{ background:var(--red); }

      /* Job card */
      .jobcard{
        background:var(--white); border:2px dashed var(--hairline);
        border-radius:var(--radius); padding:22px 20px;
      }
      .jobcard-head{ text-align:center; border-bottom:1px solid var(--hairline); padding-bottom:14px; margin-bottom:16px; }
      .jobcard-head .jc-trust{ font-size:19px; }
      .jobcard-head .jc-label{ color:var(--meta); font-size:14px; letter-spacing:.08em; text-transform:uppercase; margin-top:3px; }
      .jobcard .photo-tile{ margin-top:0; }
      .jc-row{ margin-top:16px; }
      .jc-row .jc-k{ color:var(--meta); font-size:15px; margin:0 0 3px; }
      .jc-row .jc-v{ font-size:20px; margin:0; }
      .jc-cost{
        background:var(--fog); border-radius:18px; padding:16px 20px;
        display:flex; justify-content:space-between; align-items:center; margin-top:18px;
        font-size:19px;
      }
      .jc-cost b{ font-size:22px; font-weight:600; }
      .state-banner{
        border-radius:20px; padding:16px 20px; text-align:center;
        font-size:19px; margin-top:18px;
        display:flex; align-items:center; justify-content:center; gap:10px;
      }
      .state-banner svg{ width:24px; height:24px; }
      .state-banner.blue{ background:#E8F2FD; color:var(--blue); }
      .state-banner.green{ background:#E5F5EC; color:var(--green); }

      /* Rooms */
      .room-card{ display:flex; align-items:center; gap:16px; }
      .room-icon{
        width:64px; height:64px; flex:0 0 64px; border-radius:50%;
        background:var(--white); display:flex; align-items:center; justify-content:center;
        color:var(--teal);
      }
      .room-icon svg{ width:32px; height:32px; }
      .room-info{ flex:1; }
      .room-info .card-title{ margin:0; }
      .room-card .status-chip{ margin-top:0; }

      /* Fees */
      .resident-card{ text-align:center; padding:26px 20px; }
      .avatar{
        width:76px; height:76px; border-radius:50%;
        background:var(--teal); color:#fff;
        display:flex; align-items:center; justify-content:center;
        font-size:30px; margin:0 auto 12px;
      }
      .amount-big{ font-size:40px; letter-spacing:-0.02em; margin:14px 0 2px; }
      .due-line{ color:var(--red); font-size:18px; margin:0; }
      .receipt-card{ text-align:center; padding:26px 20px; }
      .receipt-card .status-chip{ margin-top:0; }

      /* Reports */
      .report-card{ padding:24px 22px; }
      .report-top{ display:flex; align-items:center; gap:16px; }
      .report-icon{
        width:60px; height:60px; flex:0 0 60px; border-radius:50%;
        background:var(--white); display:flex; align-items:center; justify-content:center;
      }
      .report-icon svg{ width:30px; height:30px; }
      .report-num{ font-size:36px; letter-spacing:-0.02em; line-height:1.1; }
      .report-label{ color:var(--muted); font-size:17px; }
      .bar-track{ height:12px; border-radius:6px; background:var(--white); margin-top:18px; overflow:hidden; }
      .bar-fill{ height:100%; border-radius:6px; }

      .section-gap{ height:8px; }
    </style>
  </head>

      var ILLUS_HERO =
        '<svg viewBox="0 0 360 210" fill="none" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Temple, hostel and guest house connected to one system">' +

          '<div class="field"><label for="f-pass">' + t('password') + '</label>' +
            '<div class="field-wrap">' + I.lock + '<input id="f-pass" type="password" placeholder="••••••" /></div></div>' +
          '<button type="button" class="btn btn-blue" onclick="doLogin()">' + t('login') + '</button>' +
          '<p class="demo-note">' + t('loginNote') + '</p>' +
          '<p class="login-footer">' + t('loginFooter') + '</p>' +
        '</div>';
      }
      function doLogin(){ stack = ['home']; render(); window.scrollTo(0, 0); }

      function tile(screen, icon, label, color, tint){
        return '<button type="button" class="tile" onclick="go(\'' + screen + '\')">' +
          '<span class="chip" style="background:' + tint + ';color:' + color + '">' + icon + '</span>' +
          '<span class="tile-label">' + label + '</span></button>';
      }
      function scrHome(){
        return header(t('homeTitle')) + '<div class="view">' +
          '<h2 class="greeting">' + t('greeting') + '</h2>' +
          '<p class="greeting-sub">' + t('greetingSub') + '</p>' +
          '<div class="tile-grid">' +
            tile('complaint', I.plus, t('appNew'), '#0071E3', '#E8F2FD') +
            tile('my', I.ticket, t('appMy'), '#B07261', '#F7EAE5') +
            tile('jobcard', I.tool, t('appWork'), '#E8A13A', '#FBF1DE') +
            tile('guest', I.bed, t('appGuest'), '#0E7C86', '#E2F1F2') +
            tile('hostel', I.building, t('appHostel'), '#5B8DEF', '#EAF0FE') +
            tile('hostel', I.rupee, t('appFees'), '#1F9D55', '#E5F5EC') +
            tile('reports', I.chart, t('appReports'), '#7A6FD0', '#EFEDFA') +
          '</div></div>';
      }

      function stepDots(){
        function d(i){
          var cls = cmp.step === i ? 'now' : (cmp.step > i ? 'done' : '');
          var inner = cmp.step > i ? I.check : i;
          return '<div class="step-dot ' + cls + '">' + inner + '</div>';
        }
        return '<div class="step-dots">' + d(1) + '<div class="step-line"></div>' + d(2) + '<div class="step-line"></div>' + d(3) + '</div>';
      }

      function scrComplaint(){
        var body = '';
        if (cmp.step === 1) {
          var cats = CATS.map(function(c){
            return '<button type="button" class="cat' + (cmp.cat === c.key ? ' selected' : '') + '" style="color:' + c.color + '" onclick="pickCat(\'' + c.key + '\')">' + c.icon + '<span style="color:var(--ink)">' + t(c.label) + '</span></button>';
          }).join('');
          body = '<h2 class="step-q">' + t('qProblem') + '</h2><div class="cat-grid">' + cats + '</div>' +
            '<button type="button" class="btn btn-blue' + (cmp.cat ? '' : ' disabled') + '" onclick="cmpStep(2)">' + t('next') + '</button>';
        } else if (cmp.step === 2) {
          var places = PLACES.map(function(p){
            return '<button type="button" class="place' + (cmp.place === p ? ' selected' : '') + '" onclick="pickPlace(\'' + p + '\')">' + I.pin + '<span>' + t(p) + '</span></button>';
          }).join('');
          body = '<h2 class="step-q">' + t('qWhere') + '</h2><div class="place-list">' + places + '</div>';
          if (cmp.photo) {
            body += '<div class="photo-tile">' + ILLUS_TAP + '<div class="photo-ok">' + I.check + t('photoAdded') + '</div></div>';
          } else {
            body += '<button type="button" class="btn btn-fog" onclick="takePhoto()">' + I.camera + t('takePhoto') + '</button>';
          }
          if (cmp.spoken) {
            body += '<div class="spoken-box">' + t('spokenLine') + '</div>';
          } else {
            body += '<p class="or-line">' + t('orWord') + '</p>' +
              '<button type="button" class="btn btn-outline" onclick="speakNow()">' + I.mic + t('speak') + '</button>';
          }
          body += '<button type="button" class="btn btn-blue' + (cmp.place ? '' : ' disabled') + '" onclick="cmpStep(3)">' + t('next') + '</button>';
        } else {
          function urg(val, labelKey, color){
            return '<button type="button" class="urgency' + (cmp.urg === val ? ' selected' : '') + '" onclick="pickUrg(\'' + val + '\')">' +
              '<span class="dot" style="background:' + color + '"></span><span>' + t(labelKey) + '</span></button>';
          }
          body = '<h2 class="step-q">' + t('qUrgent') + '</h2><div class="urgency-list">' +
            urg('normal', 'urgNormal', '#1F9D55') + urg('urgent', 'urgUrgent', '#E8A13A') + urg('very', 'urgVery', '#D64545') +
            '</div>' +
            '<button type="button" class="btn btn-green' + (cmp.urg ? '' : ' disabled') + '" onclick="submitComplaint()">' + I.check + t('submit') + '</button>';
        }
        return header(t('newTitle')) + '<div class="view">' + stepDots() + body + '</div>';
      }
      function pickCat(k){ cmp.cat = k; render(); }
      function pickPlace(p){ cmp.place = p; render(); }
      function pickUrg(u){ cmp.urg = u; render(); }
      function takePhoto(){ cmp.photo = true; render(); }
      function speakNow(){ cmp.spoken = true; render(); }
      function cmpStep(n){ cmp.step = n; render(); window.scrollTo(0, 0); }
      function submitComplaint(){ go('success'); }

      function scrSuccess(){
        return header(t('newTitle')) + '<div class="view"><div class="success-wrap">' +
          '<div class="big-tick">' + I.check + '</div>' +
          '<h2 class="success-title">' + t('successTitle') + '</h2>' +
          '<p class="ticket-no">' + t('ticketNo') + ': <b>CMP-1042</b></p>' +
          tracker(0) +
          '<button type="button" class="btn btn-blue" onclick="finishFlow()">' + I.home + t('goHome') + '</button>' +
        '</div></div>';
      }
      function finishFlow(){
        cmp = { cat: null, place: null, photo: false, spoken: false, urg: null, step: 1 };
        goHome();
      }

      function complaintCard(c){
        return '<button type="button" class="card" onclick="openDetail(' + c.id + ')">' +
          '<div class="card-top"><div class="thumb" style="color:' + c.color + ';background:' + c.tint + '">' + c.icon + '</div>' +
          '<div><p class="card-title">' + t(c.titleKey) + '</p>' +
          '<p class="card-sub">' + I.pin + t(c.placeKey) + '</p></div></div>' +
          statusChip(c.status) + '</button>';
      }
      function scrMy(){
        return header(t('myTitle')) + '<div class="view">' + COMPLAINTS.map(complaintCard).join('') + '</div>';
      }
      function openDetail(id){ detailId = id; go('detail'); }
      function scrDetail(){
        var c = COMPLAINTS.filter(function(x){ return x.id === detailId; })[0];
        var state = c.status === 'waiting' ? 0 : (c.status === 'going' ? 1 : 2);
        return header(t('myTitle')) + '<div class="view">' +
          '<div class="card"><div class="card-top"><div class="thumb" style="color:' + c.color + ';background:' + c.tint + '">' + c.icon + '</div>' +
          '<div><p class="card-title">' + t(c.titleKey) + '</p>' +
          '<p class="card-sub">' + I.pin + t(c.placeKey) + '</p>' +
          '<p class="card-sub">' + I.ticket + 'CMP-104' + c.id + '</p></div></div>' +
          statusChip(c.status) + '</div>' +
          tracker(state) +
          '<button type="button" class="btn btn-blue" onclick="go(\'jobcard\')">' + I.tool + t('seeJobCard') + '</button>' +
        '</div>';
      }

      function scrJobcard(){
        var banner = '';
        if (jobState === 'started') banner = '<div class="state-banner blue">' + I.clock + t('workStartedMsg') + '</div>';
        if (jobState === 'done') banner = '<div class="state-banner green">' + I.check + t('workDoneMsg') + '</div>';
        var buttons = '';
        if (jobState === 'todo') {
          buttons = '<button type="button" class="btn btn-blue" onclick="setJob(\'started\')">' + I.play + t('startWork') + '</button>';
        } else if (jobState === 'started') {
          buttons = '<button type="button" class="btn btn-green" onclick="setJob(\'done\')">' + I.check + t('workDoneBtn') + '</button>';
        }
        return header(t('jobTitle')) + '<div class="view">' +
          '<div class="jobcard">' +
            '<div class="jobcard-head"><div class="jc-trust">' + t('trustName') + '</div><div class="jc-label">' + t('jobTitle') + ' · JC-221</div></div>' +
            '<div class="photo-tile">' + ILLUS_TAP + '</div>' +
            '<div class="jc-row"><p class="jc-k">' + t('jcWork') + '</p><p class="jc-v">' + t('jcWorkText') + '</p></div>' +
            '<div class="jc-row"><p class="jc-k">' + t('appMy') + ' · ' + t('ticketNo') + '</p><p class="jc-v">CMP-1041</p></div>' +
            '<div class="jc-row"><p class="jc-k">' + t('qWhere') + '</p><p class="jc-v">' + t('placeHostelA') + '</p></div>' +
            '<div class="jc-row"><p class="jc-k">' + t('jcWho') + '</p><p class="jc-v">' + t('jcAgency') + '</p></div>' +
            '<div class="jc-cost"><span>' + t('jcCost') + '</span><b>Rs 850</b></div>' +
            banner + buttons +
          '</div></div>';
      }
      function setJob(s){ jobState = s; render(); }

      function scrGuest(){
        var cards = rooms.map(function(r){
          var chip = r.booked
            ? '<span class="status-chip chip-red">' + t('roomBooked') + '</span>'
            : '<span class="status-chip chip-green">' + t('roomEmpty') + '</span>';
          return '<div class="card"><div class="room-card">' +
            '<div class="room-icon">' + I.bed + '</div>' +
            '<div class="room-info"><p class="card-title">' + t('room') + ' ' + r.no + '</p></div>' + chip +
          '</div></div>';
        }).join('');
        return header(t('guestTitle')) + '<div class="view">' + cards +
          '<button type="button" class="btn btn-blue" onclick="go(\'booking\')">' + I.plus + t('newBooking') + '</button></div>';
      }
      function scrBooking(){
        return header(t('newBooking')) + '<div class="view">' +
          '<div class="field"><label for="g-name">' + t('guestName') + '</label>' +
            '<div class="field-wrap">' + I.user + '<input id="g-name" type="text" placeholder="..." /></div></div>' +
          '<div class="field"><label for="g-mobile">' + t('mobile') + '</label>' +
            '<div class="field-wrap">' + I.phone + '<input id="g-mobile" type="tel" inputmode="numeric" placeholder="98765 43210" /></div></div>' +
          '<button type="button" class="btn btn-green" onclick="confirmBooking()">' + I.check + t('confirmBooking') + '</button>' +
        '</div>';
      }
      function confirmBooking(){ rooms[0].booked = true; go('booked'); }
      function scrBooked(){
        return header(t('guestTitle')) + '<div class="view"><div class="success-wrap">' +
          '<div class="big-tick">' + I.check + '</div>' +
          '<h2 class="success-title">' + t('bookedTitle') + '</h2>' +
          '<p class="ticket-no">' + t('room') + ' 101</p>' +
          '<p class="trust-sub">' + t('bookedSub') + '</p>' +
          '<button type="button" class="btn btn-blue" onclick="goHome()">' + I.home + t('goHome') + '</button>' +
        '</div></div>';
      }

      function scrHostel(){
        var body;
        if (!feePaid) {
          body = '<div class="card resident-card">' +
            '<div class="avatar">' + t('residentName').charAt(0) + '</div>' +
            '<p class="card-title" style="font-size:23px">' + t('residentName') + '</p>' +
            '<p class="card-sub" style="justify-content:center">' + I.pin + t('roomBed') + '</p>' +
            '<p class="report-label" style="margin-top:22px">' + t('feesDue') + '</p>' +
            '<p class="amount-big">Rs 3,500</p>' +
            '<p class="due-line">' + t('payBy') + '</p></div>' +
            '<button type="button" class="btn btn-green" onclick="payFees()">' + I.rupee + t('payFees') + '</button>';
        } else {
          body = '<div class="card receipt-card">' +
            '<span class="status-chip chip-green"><span class="cdot"></span>' + t('paidWord') + '</span>' +
            '<p class="card-title" style="font-size:23px;margin-top:16px">' + t('residentName') + '</p>' +
            '<p class="card-sub" style="justify-content:center">' + I.pin + t('roomBed') + '</p>' +
            '<p class="amount-big">Rs 3,500</p>' +
            '<p class="report-label">' + t('receipt') + '</p>' +
            '<p class="ticket-no" style="margin-top:4px">' + t('receiptNo') + ': <b>HSTFEE-2211</b></p></div>' +
            '<button type="button" class="btn btn-fog" onclick="unpayFees()">' + t('backWord') + '</button>';
        }
        return header(t('hostelTitle')) + '<div class="view">' + body + '</div>';
      }
      function payFees(){ feePaid = true; render(); }
      function unpayFees(){ feePaid = false; render(); }

      function reportCard(icon, num, labelKey, color, tint, pct){
        return '<div class="card report-card"><div class="report-top">' +
          '<div class="report-icon" style="color:' + color + '">' + icon + '</div>' +
          '<div><div class="report-num">' + num + '</div><div class="report-label">' + t(labelKey) + '</div></div></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
      }
      function scrReports(){
        return header(t('repTitle')) + '<div class="view">' +
          reportCard(I.ticket, '128', 'rep1', '#0071E3', '#E8F2FD', 72) +
          reportCard(I.check, '112', 'rep2', '#1F9D55', '#E5F5EC', 88) +
          reportCard(I.rupee, 'Rs 2,40,000', 'rep3', '#0E7C86', '#E2F1F2', 64) +
        '</div>';
      }

      /* ---------- Render ---------- */
      var SCREENS = {
        login: scrLogin, home: scrHome, complaint: scrComplaint, success: scrSuccess,
        my: scrMy, detail: scrDetail, jobcard: scrJobcard,
        guest: scrGuest, booking: scrBooking, booked: scrBooked,
        hostel: scrHostel, reports: scrReports
      };
      function render(){
        document.getElementById('phone').innerHTML = SCREENS[cur()]();
      }
      render();
    </script>
  </body>
</html>
